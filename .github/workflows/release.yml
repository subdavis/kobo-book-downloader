name: Release

on:
  release:
    types: [created]

jobs:
  publish:
    name: Publish to PyPI ✨
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: actions/setup-python@v1
        with:
          python-version: '3.11'
          architecture: 'x64'

      - run: pip install poetry twine
      - run: poetry install
      - run: poetry build
      - run: twine upload dist/*
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.TWINE_PASSWORD }}

  pyinstaller:
    name: Build for multiple platforms
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: ["windows-latest", "macos-latest", "ubuntu-latest"]
        python-version: [3.11]
        include:
          -
            os: windows-latest
            name: windows
          -
            os: macos-latest
            name: macos
          -
            os: ubuntu-latest
            name: ubuntu

    steps:
      -
        uses: actions/checkout@v2
      -
        name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v2
        with:
          python-version: ${{ matrix.python-version }}
      -
        name: Install tox
        run: |
          python -m pip install --upgrade pip;
          pip install tox;
      -
        run: tox -e buildcli -- --name kobodl-${{ matrix.name }}
      -
        name: Smoke test the web server
        shell: bash
        run: |
          ./dist/kobodl-${{ matrix.name }}* serve --port 8451 > serve.log 2>&1 &
          server_pid=$!
          status=1
          for _ in $(seq 30); do
            if curl -fsS http://127.0.0.1:8451/user > /dev/null; then
              status=0
              break
            fi
            sleep 1
          done
          kill $server_pid || true
          cat serve.log
          if [ $status -ne 0 ]; then
            echo "::error::the bundled web server could not render /user"
          fi
          exit $status
      - 
        name: Upload Release Asset
        uses: alexellis/upload-assets@0.3.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          asset_paths: '["./dist/kobodl*"]'
